<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADCC 2026 Pick Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#151312;
    --panel:#1e1b19;
    --panel-2:#26221f;
    --line:#3a342f;
    --text:#f1ece5;
    --muted:#93897d;
    --amber:#d6a92c;
    --amber-dim:#4a3d1c;
    --red:#8f3a2e;
    --green:#5c8f52;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:22px 18px 16px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.3px;
    margin:0 0 4px;
  }
  header p{
    margin:0 0 10px;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    max-width:60ch;
  }
  .identity{
    font-size:12.5px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .identity strong{color:var(--amber);font-weight:600;}
  .identity button{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:11px;
    padding:3px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .save-status{font-size:11px;color:var(--muted);}
  .save-status.ok{color:var(--green);}
  .save-status.err{color:var(--red);}

  .name-gate{
    max-width:340px;
    margin:60px auto;
    padding:0 18px;
    text-align:center;
  }
  .name-gate h2{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    margin-bottom:6px;
  }
  .name-gate p{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.5;}
  .name-gate input{
    width:100%;
    padding:10px 12px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    font-size:14px;
    margin-bottom:10px;
  }
  .name-gate button{
    width:100%;
    padding:10px 12px;
    background:var(--amber);
    border:none;
    color:#1a1610;
    font-weight:600;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    font-family:'Oswald',sans-serif;
  }

  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    padding:8px 13px;
    border-radius:5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#1a1610;
    font-weight:600;
  }
  main{padding:18px 0 60px;}
  .division{display:none;}
  .division.active{display:block;}
  .champion-banner{
    margin:0 18px 18px;
    padding:14px 16px;
    background:linear-gradient(135deg,var(--amber-dim),var(--panel-2));
    border:1px solid var(--amber);
    border-radius:8px;
  }
  .champion-banner .label{
    font-size:11px;
    color:var(--amber);
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin-bottom:3px;
  }
  .champion-banner .name{
    font-family:'Oswald',sans-serif;
    font-size:19px;
    font-weight:600;
  }
  .champion-banner.empty{
    border-color:var(--line);
    background:var(--panel);
  }
  .champion-banner.empty .label{color:var(--muted);}
  .champion-banner.empty .name{color:var(--muted);font-weight:400;font-size:14px;}
  .bracket-scroll{
    overflow-x:auto;
    padding:4px 18px 10px;
  }
  .bracket{
    display:flex;
    gap:22px;
    min-width:max-content;
  }
  .round{
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    min-width:170px;
  }
  .round-label{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1.2px;
    text-align:center;
    margin-bottom:10px;
  }
  .match{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
    margin:10px 0;
  }
  .slot{
    padding:9px 11px;
    font-size:13.5px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    color:var(--text);
  }
  .slot:last-child{border-bottom:none;}
  .slot:hover:not(.locked):not(.pending){background:var(--panel-2);}
  .slot.pending, .slot.locked{
    color:var(--muted);
    cursor:default;
    font-style:italic;
  }
  .slot.picked{
    background:var(--amber-dim);
    color:var(--amber);
    font-weight:600;
  }
  .slot.picked::after{
    content:"✓";
    font-size:12px;
  }
  .superfight-wrap{
    margin:0 18px 30px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    max-width:360px;
  }
  .superfight-wrap h2{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--red);
    margin:0 0 12px;
  }
  .reset-row{
    margin:0 18px 20px;
  }
  .reset-row button{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:12px;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
  }
  .group-wrap{padding:0 18px;}
  .group-wrap .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .group-wrap .toolbar button{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-size:12px;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
  }
  .group-note{color:var(--muted);font-size:12px;margin-bottom:14px;line-height:1.5;}
  table.group-table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
    min-width:760px;
  }
  .group-table-scroll{overflow-x:auto;padding-bottom:20px;}
  table.group-table th, table.group-table td{
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    text-align:left;
    white-space:nowrap;
  }
  table.group-table th{
    color:var(--muted);
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.6px;
  }
  table.group-table td.me{color:var(--amber);}
  .empty-state{color:var(--muted);font-size:13px;padding:20px 0;}
  footer{
    padding:16px 18px 40px;
    color:var(--muted);
    font-size:11.5px;
    line-height:1.6;
    border-top:1px solid var(--line);
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
const DIVISIONS = [
  { key:'m66', label:"M −66kg", roster:["Diego Pato","Jakub Wikłacz","Gianni Grippo","Felipe Machado","Fabricio Andrey","David Mateus Santos","Kennedy Maciel","Kamil Wilk","Owen Jones","Ryoma Anraku","Nikodem Mikuliszyn","Gavin Corbe","Dorian Olivarez","Bekzat Kapashov","Dominic Mejia","Yigit Hanay"] },
  { key:'m77', label:"M −77kg", roster:["Vagner Rocha","Michael Sainz","Alexandre De Jesus","Magomed Dzharbaev","Elijah Dorsey","Mateusz Gamrot","Mateusz Szczecinski","Julio Martins","PJ Barch","Kaya Rudolph","Tommy Langaker","Taylor Pearman","Dante Leon","Nikolay Vetrov","Oliver Taza","Jacob Bornemann"] },
  { key:'m88', label:"M −88kg", roster:["Felipe Costa","Mateusz Mazur","Pawel Jaworski","Roberto Dib Frias","Matheus Diniz","Lucas Kanard","Jonathan Blank","Gabriel Brod","Chris Wojcik","Santeri Lilius","Jozef Chen","Franco Diaz","Marlon Tajik","Faris Ben-Lamkadem","Gustavo Batista","Nathan Haddad"] },
  { key:'m99', label:"M −99kg", roster:["Kaynan Duarte","Nicholas Maglicic","Javier Zaruski","Vinicius Lessa","Michael Pixley","Daniel Schuardt","Eoghan O'Flanagan","Adam Wardziński","Luke Griffith","Marcin Maciulewicz","Steffen Banta","Patrick Gaudio","Roberto Abreu","Eli Braz","Declan Moody","Achilles Rocha"] },
  { key:'mp99', label:"M +99kg", roster:["Felipe Pena","Belal Etiabari","Haisam Rida","Nick Hartman","Josh Saunders","Francis Pana","Roosevelt Sousa","Brandon Reed","Daniel Manasoiu","Pedro Lucas","Pouya Rahmani","Mark Macqueen","Victor Hugo","Heikki Jussila","Ruslan Abdulaev","Tito John Carle"] },
  { key:'w55', label:"W −55kg", roster:["Jasmine Rocha","Kanae Ikeda","Ana Mayordomo","Sheliah Lindsey","Mayssa Bastos","Valerie Hamilton","Anna Rodrigues","Janette Gloger"] },
  { key:'w65', label:"W −65kg", roster:["Ana Carolina Vieira","Nadia Frankland","Ane Svendsen","Morgan Black","Sarah Galvao","Livia Barasine","Injana Goodman","Joslyn Molina"] },
  { key:'wp65', label:"W +65kg", roster:["Helena Crevar","Matilda Reid","Nia Blackman","Elizabeth Mitrovic","Anabel Lopez","Gabrieli Pessanha","Paige Ivette-Clymer","Yara Soares"] },
];
const ROUND_LABELS_16 = ["Round of 16","Quarterfinals","Semifinals","Final"];
const ROUND_LABELS_8 = ["Quarterfinals","Semifinals","Final"];
// Change this to whatever you want — it's a soft gate to keep casual visitors
// out of the results-entry screen, not real security (anyone who reads the
// page source can see it). Fine for a friendly gym competition.
const ADMIN_PASSCODE = "neighborhoodbjj2026";

function slugify(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'guest';
}
function freshWinners(){
  const w = {};
  DIVISIONS.forEach(d=>{
    const rounds = Math.log2(d.roster.length);
    w[d.key] = Array.from({length: rounds}, (_,r)=> Array(d.roster.length / Math.pow(2, r+1)).fill(null));
  });
  return w;
}

// ====== FIREBASE SETUP ======
// TODO: paste your own config from Firebase Console → Project Settings → Your apps
const firebaseConfig = {
  apiKey: "AIzaSyAbwXlnDrm8yxB3eOWloStGsx-CqwhSDUI",
  authDomain: "adcc-bracket-picks-2026.firebaseapp.com",
  projectId: "adcc-bracket-picks-2026",
  storageBucket: "adcc-bracket-picks-2026.firebasestorage.app",
  messagingSenderId: "809400575109",
  appId: "1:809400575109:web:fd39e012a0311a51ab75ec"
};
const firebaseReady = firebaseConfig.apiKey !== "PASTE_ME";
let db = null;
let firebaseError = null;
try{
  if(firebaseReady){
    if(typeof firebase === 'undefined'){
      throw new Error('Firebase SDK did not load (check network/ad-blocker/script tags).');
    }
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
}catch(e){
  console.error('Firebase init failed:', e);
  firebaseError = e.message;
}

// Personal identity ("who am I on this device") stays in localStorage — no need to share it.
// Everyone's actual picks live in Firestore, in the "picks" collection, one doc per person.
async function safeGet(key, shared){
  if(!shared){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  if(!firebaseReady) return null;
  try{
    const doc = await db.collection('picks').doc(key).get();
    return doc.exists ? doc.data().data : null;
  }catch(e){ console.error(e); return null; }
}
async function safeSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem(key, value); return {key, value, shared}; }catch(e){ return null; }
  }
  if(!firebaseReady) return null;
  try{
    await db.collection('picks').doc(key).set({ data: value });
    return {key, value, shared};
  }catch(e){ console.error(e); return null; }
}
async function safeList(prefix, shared){
  // Used only for the shared "picks" collection — prefix is always "picks:" in this app,
  // and Firestore doc IDs here are already just the slug, so we return every doc.
  if(!firebaseReady) return [];
  try{
    const snap = await db.collection('picks').get();
    return snap.docs.map(d => d.id);
  }catch(e){ console.error(e); return []; }
}

// Official results live in their own Firestore collection, separate from
// individual picks, so everyone reads the same single document.
async function getOfficialResults(){
  if(!firebaseReady) return null;
  try{
    const doc = await db.collection('official').doc('results').get();
    return doc.exists ? doc.data().data : null;
  }catch(e){ console.error(e); return null; }
}
async function setOfficialResults(value){
  if(!firebaseReady) return null;
  try{
    await db.collection('official').doc('results').set({ data: value });
    return true;
  }catch(e){ console.error(e); return null; }
}

let state = {
  loading: true,
  displayName: null,
  slug: null,
  winners: freshWinners(),
  superfightPick: null,
  activeDiv: DIVISIONS[0].key,
  saveStatus: '',
  groupRows: null,
  groupLoading: false,
  officialResults: null,      // { winners: {...}, superfightWinner: null }
  officialLoading: false,
  officialSaveStatus: '',
  adminUnlocked: false,
  adminActiveDiv: DIVISIONS[0].key,
};

async function init(){
  try{
    if(localStorage.getItem('admin-unlocked') === '1') state.adminUnlocked = true;
  }catch(e){}

  const savedName = await safeGet('my-name', false);
  if(savedName){
    state.displayName = savedName;
    state.slug = slugify(savedName);
    const raw = await safeGet('picks:' + state.slug, true);
    if(raw){
      try{
        const parsed = JSON.parse(raw);
        state.winners = parsed.winners || freshWinners();
        state.superfightPick = parsed.superfightPick || null;
      }catch(e){}
    }
  }
  state.loading = false;
  render();
}

async function loadOfficialResults(){
  state.officialLoading = true;
  render();
  const raw = await getOfficialResults();
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      state.officialResults = { winners: parsed.winners || freshWinners(), superfightWinner: parsed.superfightWinner || null };
    }catch(e){
      state.officialResults = { winners: freshWinners(), superfightWinner: null };
    }
  } else {
    state.officialResults = { winners: freshWinners(), superfightWinner: null };
  }
  state.officialLoading = false;
  render();
}
async function ensureOfficialResultsLoaded(){
  if(state.officialResults !== null) return;
  await loadOfficialResults();
}

async function setName(name){
  state.displayName = name;
  state.slug = slugify(name);
  await safeSet('my-name', name, false);
  const raw = await safeGet('picks:' + state.slug, true);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      state.winners = parsed.winners || freshWinners();
      state.superfightPick = parsed.superfightPick || null;
    }catch(e){ state.winners = freshWinners(); state.superfightPick = null; }
  } else {
    state.winners = freshWinners();
    state.superfightPick = null;
  }
  render();
  await savePicks();
}

async function savePicks(){
  if(!state.slug) return;
  state.saveStatus = 'Saving…';
  renderStatusOnly();
  const payload = JSON.stringify({
    displayName: state.displayName,
    winners: state.winners,
    superfightPick: state.superfightPick,
    updatedAt: Date.now()
  });
  const result = await safeSet('picks:' + state.slug, payload, true);
  state.saveStatus = result ? 'Saved' : 'Could not save';
  renderStatusOnly();
}

function renderStatusOnly(){
  const el = document.getElementById('save-status');
  if(el){
    el.textContent = state.saveStatus;
    el.className = 'save-status' + (state.saveStatus==='Saved' ? ' ok' : state.saveStatus==='Could not save' ? ' err' : '');
  }
}

function getParticipants(div, r, m){
  if(r === 0) return [div.roster[m*2], div.roster[m*2+1]];
  const prev = state.winners[div.key][r-1];
  return [prev[m*2], prev[m*2+1]];
}
function clearDownstream(div, r, m){
  const totalRounds = state.winners[div.key].length;
  for(let rr = r+1; rr < totalRounds; rr++){
    const idx = Math.floor(m / Math.pow(2, rr - r));
    state.winners[div.key][rr][idx] = null;
  }
}
function pick(divKey, r, m, name){
  const div = DIVISIONS.find(d=>d.key===divKey);
  state.winners[div.key][r][m] = name;
  clearDownstream(div, r, m);
  render();
  savePicks();
}
function pickSuperfight(name){
  state.superfightPick = name;
  render();
  savePicks();
}
async function resetMyBracket(){
  state.winners = freshWinners();
  state.superfightPick = null;
  render();
  await savePicks();
}
async function loadGroup(){
  state.groupLoading = true;
  render();
  const keys = await safeList('picks:', true);
  const rows = [];
  for(const key of keys){
    const raw = await safeGet(key, true);
    if(!raw) continue;
    try{
      const parsed = JSON.parse(raw);
      rows.push(parsed);
    }catch(e){}
  }
  rows.sort((a,b)=> (a.displayName||'').localeCompare(b.displayName||''));
  state.groupRows = rows;
  state.groupLoading = false;
  render();
}

function pickOfficial(divKey, r, m, name){
  const div = DIVISIONS.find(d=>d.key===divKey);
  state.officialResults.winners[div.key][r][m] = name;
  const totalRounds = state.officialResults.winners[div.key].length;
  for(let rr = r+1; rr < totalRounds; rr++){
    const idx = Math.floor(m / Math.pow(2, rr - r));
    state.officialResults.winners[div.key][rr][idx] = null;
  }
  render();
  saveOfficialResults();
}
function pickOfficialSuperfight(name){
  state.officialResults.superfightWinner = name;
  render();
  saveOfficialResults();
}
async function saveOfficialResults(){
  state.officialSaveStatus = 'Saving…';
  render();
  const result = await setOfficialResults(JSON.stringify(state.officialResults));
  state.officialSaveStatus = result ? 'Saved' : 'Could not save';
  render();
}
function hasAnyOfficialResults(official){
  if(!official) return false;
  if(official.superfightWinner) return true;
  return DIVISIONS.some(d => (official.winners[d.key] || []).some(round => round.some(x => x)));
}
function computeScore(personWinners, personSuperfight, official){
  let correct = 0, total = 0;
  DIVISIONS.forEach(d=>{
    const totalRounds = Math.log2(d.roster.length);
    for(let r=0; r<totalRounds; r++){
      const officialRound = official.winners[d.key] ? official.winners[d.key][r] : null;
      const personRound = personWinners && personWinners[d.key] ? personWinners[d.key][r] : null;
      if(!officialRound) continue;
      officialRound.forEach((actual, idx)=>{
        if(actual){
          total++;
          if(personRound && personRound[idx] === actual) correct++;
        }
      });
    }
  });
  if(official.superfightWinner){
    total++;
    if(personSuperfight === official.superfightWinner) correct++;
  }
  const pct = total > 0 ? Math.round((correct/total) * 1000) / 10 : 0;
  return { correct, total, pct };
}

function championOf(winnersObj, divKey){
  const div = DIVISIONS.find(d=>d.key===divKey);
  const totalRounds = winnersObj[divKey] ? winnersObj[divKey].length : Math.log2(div.roster.length);
  const w = winnersObj[divKey];
  if(!w) return '—';
  return w[totalRounds-1][0] || '—';
}

function render(){
  const app = document.getElementById('app');

  if(state.loading){
    app.innerHTML = '<div class="empty-state" style="padding:60px 18px;text-align:center;">Loading…</div>';
    return;
  }

  if(!state.displayName){
    app.innerHTML = `
      <div class="name-gate">
        <h2>Who's picking?</h2>
        <p>Enter a name so your bracket saves under you and everyone else using this bracket can compare picks in the Group tab, from any device.</p>
        <input id="name-input" type="text" placeholder="Your name" maxlength="30">
        <button id="name-submit">Start picking</button>
      </div>
    `;
    document.getElementById('name-submit').onclick = ()=>{
      const val = document.getElementById('name-input').value.trim();
      if(val) setName(val);
    };
    document.getElementById('name-input').onkeydown = (e)=>{
      if(e.key === 'Enter'){
        const val = e.target.value.trim();
        if(val) setName(val);
      }
    };
    return;
  }

  let html = `
    <header>
      <h1>ADCC 2026 Pick Bracket</h1>
      <p>World Championships — Tauron Arena, Kraków, Poland — September 12–13. Tap a name to advance them; tap again on the next round to change your mind.</p>
      ${firebaseError ? `<p style="color:#c96b5a;font-size:12px;">Sync isn't working right now: ${firebaseError} Your picks will still work in this tab but won't save or share.</p>` : ''}
      <div class="identity">
        Picking as <strong>${state.displayName}</strong>
        <button id="change-name">switch</button>
        <span class="save-status" id="save-status"></span>
      </div>
    </header>
    <div class="tabs" id="tabs"></div>
    <main id="main"></main>
    <div class="reset-row"><button id="reset-btn">Reset my picks</button></div>
    <footer>
      Picks are shared: anyone using this bracket can see your name and selections in the Group tab, from any device. Rosters reflect the official confirmed competitor list as of Sept 11, 2026 — double-check against ADCC's own channels closer to weigh-ins in case of late replacements.
    </footer>
  `;
  app.innerHTML = html;

  document.getElementById('change-name').onclick = async ()=>{
    state.displayName = null;
    state.slug = null;
    await safeSet('my-name', '', false);
    render();
  };
  document.getElementById('reset-btn').onclick = resetMyBracket;

  const tabsEl = document.getElementById('tabs');
  DIVISIONS.forEach(d=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (d.key===state.activeDiv ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = ()=>{ state.activeDiv = d.key; render(); };
    tabsEl.appendChild(btn);
  });
  const sfBtn = document.createElement('button');
  sfBtn.className = 'tab' + (state.activeDiv==='superfight' ? ' active' : '');
  sfBtn.textContent = 'Superfight';
  sfBtn.onclick = ()=>{ state.activeDiv = 'superfight'; render(); };
  tabsEl.appendChild(sfBtn);

  const groupBtn = document.createElement('button');
  groupBtn.className = 'tab' + (state.activeDiv==='group' ? ' active' : '');
  groupBtn.textContent = 'Group';
  groupBtn.onclick = ()=>{ state.activeDiv = 'group'; render(); if(state.groupRows===null) loadGroup(); };
  tabsEl.appendChild(groupBtn);

  const lbBtn = document.createElement('button');
  lbBtn.className = 'tab' + (state.activeDiv==='leaderboard' ? ' active' : '');
  lbBtn.textContent = 'Leaderboard';
  lbBtn.onclick = ()=>{
    state.activeDiv = 'leaderboard';
    render();
    if(state.groupRows===null) loadGroup();
    if(state.officialResults===null) loadOfficialResults();
  };
  tabsEl.appendChild(lbBtn);

  const adminBtn = document.createElement('button');
  adminBtn.className = 'tab' + (state.activeDiv==='admin' ? ' active' : '');
  adminBtn.textContent = 'Admin';
  adminBtn.onclick = ()=>{
    state.activeDiv = 'admin';
    render();
    if(state.adminUnlocked) ensureOfficialResultsLoaded();
  };
  tabsEl.appendChild(adminBtn);

  const main = document.getElementById('main');

  if(state.activeDiv === 'group'){
    renderGroup(main);
    return;
  }
  if(state.activeDiv === 'leaderboard'){
    renderLeaderboard(main);
    return;
  }
  if(state.activeDiv === 'admin'){
    renderAdmin(main);
    return;
  }

  if(state.activeDiv === 'superfight'){
    const wrap = document.createElement('div');
    wrap.className = 'superfight-wrap';
    wrap.innerHTML = '<h2>Superfight — vacant title</h2>';
    ["Kaynan Duarte","Yuri Simoes"].forEach(name=>{
      const row = document.createElement('div');
      row.className = 'slot' + (state.superfightPick===name ? ' picked':'');
      row.textContent = name;
      row.onclick = ()=> pickSuperfight(name);
      wrap.appendChild(row);
    });
    main.appendChild(wrap);
    return;
  }

  const div = DIVISIONS.find(d=>d.key===state.activeDiv);
  const totalRounds = state.winners[div.key].length;
  const labels = totalRounds===4 ? ROUND_LABELS_16 : ROUND_LABELS_8;

  const finalWinner = state.winners[div.key][totalRounds-1][0];
  const banner = document.createElement('div');
  banner.className = 'champion-banner' + (finalWinner ? '' : ' empty');
  banner.innerHTML = finalWinner
    ? `<div class="label">Your champion</div><div class="name">${finalWinner}</div>`
    : `<div class="label">Champion</div><div class="name">Pick your way through the bracket to crown one</div>`;
  main.appendChild(banner);

  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'bracket-scroll';
  const bracket = document.createElement('div');
  bracket.className = 'bracket';

  for(let r=0; r<totalRounds; r++){
    const roundEl = document.createElement('div');
    roundEl.className = 'round';
    const label = document.createElement('div');
    label.className = 'round-label';
    label.textContent = labels[r];
    roundEl.appendChild(label);

    const numMatches = div.roster.length / Math.pow(2, r+1);
    for(let m=0; m<numMatches; m++){
      const [p1, p2] = getParticipants(div, r, m);
      const matchEl = document.createElement('div');
      matchEl.className = 'match';
      [p1, p2].forEach(name=>{
        const slot = document.createElement('div');
        const isUnresolved = (name === null);
        const isTbdRoster = (name === 'TBD');
        const isPicked = state.winners[div.key][r][m] === name && !isUnresolved && !isTbdRoster;
        slot.className = 'slot' + (isPicked ? ' picked' : '') + (isUnresolved ? ' pending' : '') + (isTbdRoster ? ' locked' : '');
        slot.textContent = isUnresolved ? '—' : name;
        if(!isUnresolved && !isTbdRoster){
          slot.onclick = ()=> pick(div.key, r, m, name);
        }
        matchEl.appendChild(slot);
      });
      roundEl.appendChild(matchEl);
    }
    bracket.appendChild(roundEl);
  }
  scrollWrap.appendChild(bracket);
  main.appendChild(scrollWrap);
}

function renderLeaderboard(main){
  const wrap = document.createElement('div');
  wrap.className = 'group-wrap';

  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = '<span class="group-note" style="margin:0;">Percentage of individual match picks correct, based on results entered so far.</span>';
  const refreshBtn = document.createElement('button');
  refreshBtn.textContent = (state.groupLoading || state.officialLoading) ? 'Loading…' : 'Refresh';
  refreshBtn.onclick = ()=>{ loadGroup(); loadOfficialResults(); };
  toolbar.appendChild(refreshBtn);
  wrap.appendChild(toolbar);

  const stillLoading = (state.groupLoading && state.groupRows===null) || (state.officialLoading && state.officialResults===null);
  if(stillLoading){
    wrap.innerHTML += '<div class="empty-state">Loading results…</div>';
    main.appendChild(wrap);
    return;
  }
  if(!hasAnyOfficialResults(state.officialResults)){
    wrap.innerHTML += '<div class="empty-state">No official results entered yet — check back after matches start finishing.</div>';
    main.appendChild(wrap);
    return;
  }
  if(!state.groupRows || state.groupRows.length===0){
    wrap.innerHTML += '<div class="empty-state">No picks saved yet.</div>';
    main.appendChild(wrap);
    return;
  }

  const scored = state.groupRows.map(row=>{
    const s = computeScore(row.winners || {}, row.superfightPick, state.officialResults);
    return { name: row.displayName || 'Unnamed', isMe: row.displayName === state.displayName, ...s };
  });
  scored.sort((a,b)=> b.pct - a.pct || b.correct - a.correct);

  const tableScroll = document.createElement('div');
  tableScroll.className = 'group-table-scroll';
  const table = document.createElement('table');
  table.className = 'group-table';
  table.innerHTML = '<thead><tr><th>Rank</th><th>Name</th><th>Correct</th><th>%</th></tr></thead>';
  const tbody = document.createElement('tbody');
  scored.forEach((row, i)=>{
    const tr = document.createElement('tr');
    const cls = row.isMe ? 'me' : '';
    tr.innerHTML = `<td class="${cls}">${i+1}</td><td class="${cls}">${row.name}${row.isMe ? ' (you)' : ''}</td><td class="${cls}">${row.correct}/${row.total}</td><td class="${cls}">${row.pct}%</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableScroll.appendChild(table);
  wrap.appendChild(tableScroll);
  main.appendChild(wrap);
}

function renderAdmin(main){
  if(!state.adminUnlocked){
    const wrap = document.createElement('div');
    wrap.className = 'name-gate';
    wrap.innerHTML = `
      <h2>Admin access</h2>
      <p>Enter the passcode to record official match results as they finish.</p>
      <input id="admin-passcode" type="password" placeholder="Passcode">
      <button id="admin-submit">Unlock</button>
    `;
    main.appendChild(wrap);
    const submit = ()=>{
      const val = document.getElementById('admin-passcode').value;
      if(val === ADMIN_PASSCODE){
        state.adminUnlocked = true;
        try{ localStorage.setItem('admin-unlocked', '1'); }catch(e){}
        ensureOfficialResultsLoaded();
      } else {
        alert('Wrong passcode.');
      }
    };
    document.getElementById('admin-submit').onclick = submit;
    document.getElementById('admin-passcode').onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
    return;
  }

  if(state.officialResults === null){
    main.innerHTML += '<div class="empty-state">Loading…</div>';
    ensureOfficialResultsLoaded();
    return;
  }

  const note = document.createElement('div');
  note.className = 'group-note';
  note.style.padding = '0 18px';
  note.textContent = 'Click the actual winner of each match as results come in. This updates the Leaderboard for everyone.';
  main.appendChild(note);

  const subTabs = document.createElement('div');
  subTabs.className = 'tabs';
  subTabs.style.borderBottom = 'none';
  DIVISIONS.forEach(d=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (state.adminActiveDiv===d.key ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = ()=>{ state.adminActiveDiv = d.key; render(); };
    subTabs.appendChild(btn);
  });
  const sfBtn = document.createElement('button');
  sfBtn.className = 'tab' + (state.adminActiveDiv==='superfight' ? ' active' : '');
  sfBtn.textContent = 'Superfight';
  sfBtn.onclick = ()=>{ state.adminActiveDiv = 'superfight'; render(); };
  subTabs.appendChild(sfBtn);
  main.appendChild(subTabs);

  const statusEl = document.createElement('div');
  statusEl.className = 'save-status';
  statusEl.style.padding = '0 18px 10px';
  statusEl.textContent = state.officialSaveStatus;
  main.appendChild(statusEl);

  if(state.adminActiveDiv === 'superfight'){
    const wrap = document.createElement('div');
    wrap.className = 'superfight-wrap';
    wrap.innerHTML = '<h2>Superfight — actual winner</h2>';
    ["Kaynan Duarte","Yuri Simoes"].forEach(name=>{
      const row = document.createElement('div');
      row.className = 'slot' + (state.officialResults.superfightWinner===name ? ' picked' : '');
      row.textContent = name;
      row.onclick = ()=> pickOfficialSuperfight(name);
      wrap.appendChild(row);
    });
    main.appendChild(wrap);
  } else {
    const div = DIVISIONS.find(d=>d.key===state.adminActiveDiv);
    const totalRounds = state.officialResults.winners[div.key].length;
    const labels = totalRounds===4 ? ROUND_LABELS_16 : ROUND_LABELS_8;

    const scrollWrap = document.createElement('div');
    scrollWrap.className = 'bracket-scroll';
    const bracket = document.createElement('div');
    bracket.className = 'bracket';

    for(let r=0; r<totalRounds; r++){
      const roundEl = document.createElement('div');
      roundEl.className = 'round';
      const label = document.createElement('div');
      label.className = 'round-label';
      label.textContent = labels[r];
      roundEl.appendChild(label);

      const numMatches = div.roster.length / Math.pow(2, r+1);
      for(let m=0; m<numMatches; m++){
        const p1 = r===0 ? div.roster[m*2] : state.officialResults.winners[div.key][r-1][m*2];
        const p2 = r===0 ? div.roster[m*2+1] : state.officialResults.winners[div.key][r-1][m*2+1];
        const matchEl = document.createElement('div');
        matchEl.className = 'match';
        [p1, p2].forEach(name=>{
          const slot = document.createElement('div');
          const isUnresolved = (name === null || name === undefined);
          const isPicked = state.officialResults.winners[div.key][r][m] === name && !isUnresolved;
          slot.className = 'slot' + (isPicked ? ' picked' : '') + (isUnresolved ? ' pending' : '');
          slot.textContent = isUnresolved ? '—' : name;
          if(!isUnresolved){
            slot.onclick = ()=> pickOfficial(div.key, r, m, name);
          }
          matchEl.appendChild(slot);
        });
        roundEl.appendChild(matchEl);
      }
      bracket.appendChild(roundEl);
    }
    scrollWrap.appendChild(bracket);
    main.appendChild(scrollWrap);
  }

  const lockBtn = document.createElement('button');
  lockBtn.textContent = 'Lock admin panel';
  lockBtn.style.cssText = 'margin:16px 18px;background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;';
  lockBtn.onclick = ()=>{
    state.adminUnlocked = false;
    try{ localStorage.removeItem('admin-unlocked'); }catch(e){}
    render();
  };
  main.appendChild(lockBtn);
}

function renderGroup(main){
  const wrap = document.createElement('div');
  wrap.className = 'group-wrap';

  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = '<span class="group-note" style="margin:0;">Champion pick per division, across everyone using this bracket.</span>';
  const refreshBtn = document.createElement('button');
  refreshBtn.textContent = state.groupLoading ? 'Loading…' : 'Refresh';
  refreshBtn.onclick = loadGroup;
  toolbar.appendChild(refreshBtn);
  wrap.appendChild(toolbar);

  if(state.groupLoading && state.groupRows===null){
    wrap.innerHTML += '<div class="empty-state">Loading everyone&#39;s picks…</div>';
    main.appendChild(wrap);
    return;
  }
  if(!state.groupRows || state.groupRows.length===0){
    wrap.innerHTML += '<div class="empty-state">No picks saved yet — be the first.</div>';
    main.appendChild(wrap);
    return;
  }

  const tableScroll = document.createElement('div');
  tableScroll.className = 'group-table-scroll';
  const table = document.createElement('table');
  table.className = 'group-table';
  const headRow = ['Name', ...DIVISIONS.map(d=>d.label), 'Superfight'];
  table.innerHTML = `<thead><tr>${headRow.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`;
  const tbody = document.createElement('tbody');
  state.groupRows.forEach(row=>{
    const isMe = row.displayName === state.displayName;
    const tr = document.createElement('tr');
    let cells = `<td class="${isMe?'me':''}">${row.displayName || 'Unnamed'}${isMe ? ' (you)' : ''}</td>`;
    DIVISIONS.forEach(d=>{
      cells += `<td class="${isMe?'me':''}">${championOf(row.winners || {}, d.key)}</td>`;
    });
    cells += `<td class="${isMe?'me':''}">${row.superfightPick || '—'}</td>`;
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableScroll.appendChild(table);
  wrap.appendChild(tableScroll);
  main.appendChild(wrap);
}

init();
</script>
</body>
</html>
